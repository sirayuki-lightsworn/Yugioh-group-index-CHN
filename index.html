<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>游戏王群索引</title>
<style>
:root {
  --bg:#0e1117; --bg2:#161b24; --card:#1c2330; --line:#2a3344;
  --text:#e8edf5; --muted:#8b97ab; --gold:#d4b15f; --gold2:#f0d78c;
  --blue:#6ea8ff; --danger:#e57373; --ok:#7dcea0; --dead:#6b7380;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
a{color:var(--blue)}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 80px}
header.hero{background:linear-gradient(160deg,#1a2233 0%,#12161f 60%,#0e1117 100%);border:1px solid var(--line);border-radius:16px;padding:22px 20px 16px;margin-bottom:14px}
header.hero h1{margin:0 0 6px;font-size:26px;color:var(--gold2)}
.sub,.updated,.note,.hint,.tagnote,.count{color:var(--muted)}
.updated{margin-top:10px;color:var(--gold);font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn-gold{background:#3a3018;border-color:#6e5a28;color:var(--gold2)}
.btn-danger{color:var(--danger);border-color:#5a3030}
.btn-ok{color:var(--ok);border-color:#2d5a40}
.drop{position:relative;display:inline-block}
.drop-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:190px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.drop.open .drop-menu{display:block}
.drop-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.drop-menu button:hover{background:#2a2416;color:var(--gold2)}
.search-card{margin:14px 0 12px;padding:16px;border:2px solid var(--gold);border-radius:16px;background:linear-gradient(180deg,#2a2416,#161b24)}
.search-card label{display:block;color:var(--gold2);font-weight:700;margin-bottom:8px}
.search-card input{width:100%;background:#0e1117;border:1px solid #6e5a28;color:var(--text);border-radius:12px;padding:14px 16px;font-size:18px;outline:none}
.letters{position:sticky;top:0;z-index:20;background:rgba(14,17,23,.94);padding:8px 16px;display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:0 -16px 8px}
.letters a{color:var(--muted);text-decoration:none;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.card h2{margin:0 0 8px;font-size:16px;color:var(--gold2)}
.note{font-size:13px;white-space:pre-wrap}
.featured{border-color:#6e5a28;background:linear-gradient(180deg,#2a2416,#1c2330)}
.row{display:grid;grid-template-columns:minmax(160px,1.1fr) minmax(180px,1.5fr);gap:8px 16px;padding:10px 4px;border-bottom:1px solid #232b38}
body.admin .row{grid-template-columns:minmax(140px,1fr) minmax(160px,1.2fr) minmax(90px,.7fr) auto}
@media(max-width:720px){.row,body.admin .row{grid-template-columns:1fr}}
.name{font-weight:650}
.name.struck{text-decoration:line-through;color:var(--dead)}
.ids{display:flex;flex-wrap:wrap;gap:6px}
.idchip{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.idchip.dead{color:var(--dead);text-decoration:line-through;opacity:.75}
.idchip button{border:0;background:transparent;color:var(--gold);cursor:pointer}
.tags-cell{display:none;color:var(--muted);font-size:12px}
body.admin .tags-cell{display:block}
.sec-h{margin:22px 0 8px;padding-top:8px;font-size:22px;color:var(--gold);border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#223;color:#fff;padding:8px 14px;border-radius:999px;display:none;z-index:50;border:1px solid var(--gold)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}
.form-row{margin:8px 0}
.form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.form-row input,.form-row textarea,.form-row select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit}
.admin-only{display:none}
body.admin .admin-only{display:inline-flex}
.pinbox{display:none;align-items:center;gap:4px;font-size:12px;color:var(--gold2)}
body.admin .pinbox{display:inline-flex}
.hide-dead .idchip.dead,.hide-dead .row.all-dead{display:none}
.pending-card{border-color:#5a4030}
.badge{display:inline-block;background:#3a3018;color:var(--gold2);border-radius:999px;padding:1px 8px;font-size:12px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1 id="pageTitle">游戏王群索引</h1>
    <div class="sub" id="pageSub"></div>
    <div class="updated" id="lastUpdate"></div>
    <div class="toolbar">
      <button class="btn btn-gold" onclick="openSubmit()">提交新群</button>
      <div class="drop" id="exportDrop">
        <button class="btn" onclick="toggleExportMenu(event)">导出 ▾</button>
        <div class="drop-menu">
          <button type="button" onclick="exportWord()">导出到 Word</button>
          <button type="button" onclick="exportTxt()">导出到记事本</button>
          <button type="button" onclick="exportJSON()">导出 JSON 备份</button>
        </div>
      </div>
      <button class="btn" onclick="shareText()">复制为文本</button>
      <button class="btn" onclick="toggleDead()">隐藏/显示已失效群号</button>
      <button class="btn" id="adminBtn" onclick="openAdmin()">管理员</button>
      <button class="btn admin-only" onclick="openQueue()">审核队列<span class="badge" id="pendBadge"></span></button>
      <button class="btn btn-gold admin-only" onclick="openEditor(null)">直接新增</button>
      <button class="btn admin-only" onclick="openMetaEditor()">编辑说明/页头</button>
      <button class="btn admin-only" onclick="openSiteSettings()">发布设置</button>
      <button class="btn admin-only" onclick="publishToGitHub()">发布到网站</button>
      <button class="btn admin-only" onclick="logoutAdmin()">退出管理</button>
    </div>
  </header>
  <div class="card" id="aboutCard"></div>
  <div class="search-card">
    <label for="q">搜索卡组 / 别名 / 群号 / 标签</label>
    <input id="q" type="search" placeholder="例如：废二、古生物、闪刀姬" oninput="render()">
  </div>
  <div class="card pending-card admin-only" id="queueHint" style="display:none"></div>
  <div class="card featured" id="featuredCard"></div>
  <div class="letters" id="letters"></div>
  <div class="hint"><span class="count" id="count"></span> · 失效群号不提供复制</div>
  <div id="list"></div>
  <footer>
    <h2 style="color:var(--gold2);font-size:16px;">实用连接</h2>
    <ul id="linkList"></ul>
    <p class="note" id="footerNote"></p>
  </footer>
</div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
var SECTIONS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").concat(["其他"]);
var ADMIN_KEY = "ygoOfficialAdminHash_v1";
var TOKEN_KEY = "ygoOfficialPublishToken_v1";
var isAdmin = false, hideDead = false, DATA = null, DIRTY = false;

function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(function(){t.style.display="none"},1800)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function hashPw(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function today(){var d=new Date();return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear()}
function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){toast("已复制")},function(){fb(text)});
  else fb(text);
}
function fb(text){var a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("已复制")}catch(e){toast("请手动复制")}document.body.removeChild(a)}
function isUnavailable(id){if(!id||id.dead)return true;return /炸了|已解散|无法申请|已无活人|似了|死了|没了|搜不到/.test(id.note||"")}
function liveIds(g){return (g.ids||[]).filter(function(x){return !isUnavailable(x)})}
function searchBlob(g){var p=[g.name,(g.aliases||[]).join(" "),(g.tags||[]).join(" "),g.extra||"",g.section||""];(g.ids||[]).forEach(function(x){p.push(x.num,x.note||"")});return p.join(" ").toLowerCase()}
function matches(g,q){return !q||searchBlob(g).indexOf(q)!==-1}

function markDirty(){DIRTY=true;var el=document.getElementById("lastUpdate");if(el&&DATA)el.textContent="最后更新于："+DATA.updated+"（有未发布的本地修改）"}

async function loadData(){
  var res=await fetch("data.json?ts="+Date.now(),{cache:"no-store"});
  if(!res.ok) throw new Error("data.json 加载失败");
  DATA=await res.json();
  if(!DATA.groups) DATA.groups=[];
  if(!DATA.github) DATA.github={owner:"sirayuki-lightsworn",repo:"Yugioh-group-index-CHN",submitProxy:""};
  DATA.groups.forEach(function(g){if(!g.tags)g.tags=(g.aliases||[]).slice();if(g.pinned==null)g.pinned=!!g.featured});
  if(!DATA.pending) DATA.pending=[];
}

function renderId(id){
  var dead=isUnavailable(id);
  var note=id.note?'<span class="tagnote">（'+esc(id.note)+'）</span>':"";
  var btn=dead?"":'<button type="button" onclick="copyText(\''+esc(id.num)+'\')">复制</button>';
  return '<span class="idchip'+(dead?" dead":"")+'"><span>'+esc(id.num)+"</span>"+note+btn+"</span>";
}
function renderRow(g){
  var allDead=g.ids&&g.ids.length&&liveIds(g).length===0&&!g.missing;
  var extra=g.extra?'<div class="tagnote">'+esc(g.extra)+"</div>":"";
  var idsHtml=g.missing?'<span class="tagnote">暂缺</span>':(!g.ids||!g.ids.length?'<span class="tagnote">无群号</span>':'<div class="ids">'+g.ids.map(renderId).join("")+"</div>");
  var tags='<div class="tags-cell">'+(g.tags&&g.tags.length?esc(g.tags.join("，")):"无标签")+"</div>";
  var admin="";
  if(isAdmin){
    admin='<div class="toolbar"><label class="pinbox"><input type="checkbox"'+(g.pinned?" checked":"")+' onchange="togglePin(\''+g.id+'\',this.checked)">置顶</label>'+
      '<button class="btn" onclick="openEditor(\''+g.id+'\')">修改</button>'+
      '<button class="btn btn-danger" onclick="deleteGroup(\''+g.id+'\')">删除</button></div>';
  }
  return '<div class="row'+(allDead?" all-dead":"")+'" data-id="'+esc(g.id)+'"><div><div class="name'+(g.nameStruck?" struck":"")+'">'+esc(g.name)+"</div>"+extra+"</div><div>"+idsHtml+"</div>"+tags+admin+"</div>";
}
function ensureAboutFeedback(s){
  var about=s.about||"", qq=s.feedbackQq||"", ans=s.feedbackAnswer||"";
  if(qq&&about.indexOf(qq)===-1){
    about=about.replace(/\s+$/,"")+"\n\n如需人工联系管理员，可加入："+qq+(ans?"（答案："+ans+"）":"");
  }
  return about;
}
function render(){
  if(!DATA)return;
  document.title=DATA.title||"游戏王群索引";
  document.getElementById("pageTitle").textContent=DATA.title||"游戏王群索引";
  document.getElementById("pageSub").textContent=DATA.subtitle||"";
  document.getElementById("lastUpdate").textContent="最后更新于："+(DATA.updated||"")+(DIRTY?"（有未发布的本地修改）":"");
  document.getElementById("footerNote").textContent=DATA.footerNote||"";
  document.getElementById("linkList").innerHTML=(DATA.links||[]).map(function(L){return "<li><a href='"+esc(L.url)+"' target='_blank' rel='noopener'>"+esc(L.label)+"</a></li>"}).join("");
  document.getElementById("aboutCard").innerHTML="<h2>说明</h2><div class='note'>"+esc(ensureAboutFeedback(DATA))+"</div>";
  var q=(document.getElementById("q").value||"").trim().toLowerCase();
  var pinned=DATA.groups.filter(function(g){return g.pinned&&matches(g,q)});
  var feat=document.getElementById("featuredCard");
  feat.style.display=(!q&&!pinned.length)?"":(pinned.length?"":"none");
  feat.innerHTML=pinned.length?"<h2>置顶</h2>"+pinned.map(renderRow).join(""):"<h2>置顶</h2><div class='note'>暂无置顶。</div>";
  document.getElementById("letters").innerHTML=SECTIONS.map(function(L){return '<a href="#sec-'+L+'">'+L+"</a>"}).join("");
  var shown=0,html="";
  SECTIONS.forEach(function(L){
    var rows=DATA.groups.filter(function(g){return g.section===L&&matches(g,q)});
    if(!rows.length)return;
    html+='<div class="sec-h" id="sec-'+L+'">'+L+"</div>";
    rows.forEach(function(g){html+=renderRow(g);shown++});
  });
  document.getElementById("list").innerHTML=html||'<div class="note">没有匹配「'+esc(q)+'」的条目。</div>';
  document.getElementById("count").textContent=q?("找到 "+shown+" 条"):("共 "+DATA.groups.length+" 条");
  document.body.classList.toggle("admin",isAdmin);
  document.body.classList.toggle("hide-dead",hideDead);
  document.getElementById("adminBtn").textContent=isAdmin?"管理中":"管理员";
  var pb=document.getElementById("pendBadge");
  var n=(DATA.pending||[]).length;
  pb.textContent=n?(" "+n):"";
}

function toggleDead(){hideDead=!hideDead;render()}
function openModal(html){document.getElementById("modal").innerHTML=html;document.getElementById("modalBg").style.display="flex"}
function closeModal(){document.getElementById("modalBg").style.display="none"}
function toggleExportMenu(ev){if(ev)ev.stopPropagation();document.getElementById("exportDrop").classList.toggle("open")}
document.addEventListener("click",function(){var b=document.getElementById("exportDrop");if(b)b.classList.remove("open")});

function openAdmin(){
  if(isAdmin){toast("已在管理");return}
  var stored=localStorage.getItem(ADMIN_KEY);
  openModal("<h3>管理员登录</h3><p class='note'>"+(stored?"输入管理员密码。":"第一次使用请设定密码（只存在这台浏览器）。")+"</p>"+
    "<div class='form-row'><label>密码</label><input id='pw' type='password'></div>"+
    "<div class='toolbar'><button class='btn btn-gold' onclick='doLogin()'>确定</button><button class='btn' onclick='closeModal()'>取消</button></div>");
}
function doLogin(){
  var pw=document.getElementById("pw").value||"";if(!pw){toast("请输入密码");return}
  var h=hashPw(pw), stored=localStorage.getItem(ADMIN_KEY);
  if(!stored){localStorage.setItem(ADMIN_KEY,h);isAdmin=true;closeModal();render();toast("已设定密码");return}
  if(stored===h){isAdmin=true;closeModal();render();refreshRemoteQueue();toast("已进入管理")}
  else toast("密码不对");
}
function logoutAdmin(){isAdmin=false;render()}

function findGroup(id){for(var i=0;i<DATA.groups.length;i++) if(DATA.groups[i].id===id) return DATA.groups[i];return null}
function togglePin(id,on){var g=findGroup(id);if(!g)return;g.pinned=!!on;DATA.updated=today();markDirty();render()}
function deleteGroup(id){DATA.groups=DATA.groups.filter(function(g){return g.id!==id});DATA.updated=today();markDirty();render();toast("已删除（尚未发布到网站）")}

function parseIdLines(text){
  var out=[];String(text||"").split(/\n+/).forEach(function(line){
    line=line.trim();if(!line)return;
    var dead=/\[失效\]|\[死\]|\[炸\]/.test(line);
    line=line.replace(/\s*\[(失效|死|炸)\]\s*/g,"");
    var m=line.match(/^(\d{5,12})\s*(?:（([^）]*)）|\(([^)]*)\))?/);
    if(m){var note=(m[2]||m[3]||"").trim();out.push({num:m[1],note:note,dead:dead||/炸了|已解散|无法申请|已无活人/.test(note)})}
    else {
      String(line).split(/[、，,\s]+/).forEach(function(p){if(/^\d{5,12}$/.test(p))out.push({num:p,note:"",dead:false})});
    }
  });return out;
}

function openSubmit(){
  var gh=DATA.github||{};
  openModal("<h3>提交新群</h3><p class='note'>填写后点提交。管理员审核通过才会出现在公开索引里。</p>"+
    "<div class='form-row'><label>群名 *</label><input id='sName'></div>"+
    "<div class='form-row'><label>群号 *（多个用顿号或换行）</label><textarea id='sIds' rows='3'></textarea></div>"+
    "<div class='form-row'><label>别名 / 口头叫法</label><input id='sTags' placeholder='废二'></div>"+
    "<div class='form-row'><label>分区（可先不选）</label><select id='sSec'><option value=''>待管理员指定</option>"+SECTIONS.map(function(L){return "<option value='"+L+"'>"+L+"</option>"}).join("")+"</select></div>"+
    "<div class='form-row'><label>备注</label><input id='sExtra'></div>"+
    "<div class='toolbar'><button class='btn btn-gold' onclick='doSubmit()'>提交审核</button><button class='btn' onclick='closeModal()'>取消</button></div>"+
    "<p class='note' id='sMsg' style='margin-top:10px'></p>");
}
async function doSubmit(){
  var name=(document.getElementById("sName").value||"").trim();
  var ids=(document.getElementById("sIds").value||"").trim();
  var tags=(document.getElementById("sTags").value||"").trim();
  var extra=(document.getElementById("sExtra").value||"").trim();
  var section=document.getElementById("sSec").value;
  if(!name||!ids){toast("请填写群名和群号");return}
  var payload={name:name,ids:ids,tags:tags,extra:extra,section:section,source:"ygo-index"};
  var msg=document.getElementById("sMsg");
  msg.textContent="正在提交…";
  var email=(DATA.notifyEmail||"").trim();
  var proxy=(DATA.github&&DATA.github.submitProxy)||"";
  if(email){
    try{
      var res=await fetch("https://formsubmit.co/ajax/"+encodeURIComponent(email),{
        method:"POST",
        headers:{"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify({
          _subject:"【游戏王群索引】新群提交："+name,
          群名:name,
          群号:ids,
          标签:tags||"（无）",
          分区:section||"（待定）",
          备注:extra||"（无）",
          _template:"box"
        })
      });
      var data=await res.json();
      if(res.ok && (data.success || data.message)){
        msg.textContent="已提交给管理员，审核通过后会出现在索引中。不用登录 GitHub。";
        toast("提交成功");
        return;
      }
      msg.textContent="邮箱通道返回："+(data.message||res.status);
    }catch(e){msg.textContent="邮箱通道暂时不可用。"}
  }
  if(proxy){
    try{
      var res2=await fetch(proxy,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      var data2=await res2.json();
      if(data2.ok){msg.textContent="已提交，等待管理员审核。";toast("提交成功");return}
      msg.textContent="提交通道失败："+(data2.error||res2.status);
    }catch(e){msg.textContent="网络失败。"}
  }
  if(!email && !proxy){
    msg.textContent="管理员还没有配置接收邮箱。请先把群名和群号复制下来发给管理员。";
    copyText("【游戏王群索引-新群提交】\\n群名："+name+"\\n群号："+ids+"\\n标签："+tags+"\\n备注："+extra);
  }
}

function openEditor(id){
  var g={id:"g"+Date.now(),name:"",tags:[],section:"其他",ids:[],extra:"",missing:false,pinned:false};
  if(id){var f=findGroup(id);if(!f)return;g=JSON.parse(JSON.stringify(f))}
  var idLines=(g.ids&&g.ids.length?g.ids:[]).map(function(x){return (x.num||"")+(x.note?"（"+x.note+"）":"")+(isUnavailable(x)?" [失效]":"")}).join("\n");
  openModal("<h3>"+(id?"修改":"新增")+"</h3>"+
    "<div class='form-row'><label>群名</label><input id='eName' value='"+esc(g.name)+"'></div>"+
    "<div class='form-row'><label>隐藏标签</label><input id='eTags' value='"+esc((g.tags||[]).join("，"))+"'></div>"+
    "<div class='form-row'><label>分区</label><select id='eSec'>"+SECTIONS.map(function(L){return "<option value='"+L+"'"+(g.section===L?" selected":"")+">"+L+"</option>"}).join("")+"</select></div>"+
    "<div class='form-row'><label>群号（一行一个，失效请加 [失效]）</label><textarea id='eIds' rows='5'>"+esc(idLines)+"</textarea></div>"+
    "<div class='form-row'><label>备注</label><input id='eExtra' value='"+esc(g.extra||"")+"'></div>"+
    "<div class='form-row'><label><input type='checkbox' id='eMissing'"+(g.missing?" checked":"")+"> 暂缺</label> <label><input type='checkbox' id='ePinned'"+(g.pinned?" checked":"")+"> 置顶</label></div>"+
    "<div class='toolbar'><button class='btn btn-gold' onclick='saveEditor(\""+g.id+"\","+(id?"true":"false")+")'>保存</button><button class='btn' onclick='closeModal()'>取消</button></div>");
}
function saveEditor(id,exists){
  var name=document.getElementById("eName").value.trim();if(!name){toast("请填群名");return}
  var tags=document.getElementById("eTags").value.split(/[，,]/).map(function(x){return x.trim()}).filter(Boolean);
  var g={id:id,name:name,aliases:tags.slice(),tags:tags,section:document.getElementById("eSec").value,ids:parseIdLines(document.getElementById("eIds").value),extra:document.getElementById("eExtra").value.trim(),missing:document.getElementById("eMissing").checked,pinned:document.getElementById("ePinned").checked,addedAt:Date.now()};
  if(exists){var found=false;for(var i=0;i<DATA.groups.length;i++) if(DATA.groups[i].id===id){DATA.groups[i]=g;found=true;break} if(!found) DATA.groups.push(g)}
  else DATA.groups.push(g);
  DATA.updated=today();markDirty();closeModal();render();toast("已保存到本机，请点「发布到网站」");
}

function openMetaEditor(){
  var s=DATA;
  var linkText=(s.links||[]).map(function(L){return L.label+" | "+L.url}).join("\n");
  openModal("<h3>编辑说明 / 页头</h3>"+
    "<div class='form-row'><label>标题</label><input id='mTitle' value='"+esc(s.title)+"'></div>"+
    "<div class='form-row'><label>副标题</label><textarea id='mSub' rows='3'>"+esc(s.subtitle)+"</textarea></div>"+
    "<div class='form-row'><label>说明正文</label><textarea id='mAbout' rows='8'>"+esc(s.about)+"</textarea></div>"+
    "<div class='form-row'><label>页脚</label><textarea id='mFoot' rows='3'>"+esc(s.footerNote||"")+"</textarea></div>"+
    "<div class='form-row'><label>实用连接（名称 | 网址）</label><textarea id='mLinks' rows='6'>"+esc(linkText)+"</textarea></div>"+
    "<div class='toolbar'><button class='btn btn-gold' onclick='saveMeta()'>保存</button><button class='btn' onclick='closeModal()'>取消</button></div>");
}
function saveMeta(){
  DATA.title=document.getElementById("mTitle").value.trim()||DATA.title;
  DATA.subtitle=document.getElementById("mSub").value;
  DATA.about=document.getElementById("mAbout").value;
  DATA.footerNote=document.getElementById("mFoot").value;
  DATA.links=document.getElementById("mLinks").value.split(/\n+/).map(function(line){var p=line.split("|");if(p.length<2)return null;return {label:p[0].trim(),url:p.slice(1).join("|").trim()}}).filter(Boolean);
  DATA.updated=today();markDirty();closeModal();render();toast("已保存，请发布到网站");
}

function openSiteSettings(){
  var gh=DATA.github||{};
  var tok=localStorage.getItem(TOKEN_KEY)||"";
  openModal("<h3>发布设置</h3><p class='note'>发布令牌只保存在你这台电脑的浏览器里，不会写进网页文件。请使用 Fine-grained Token，权限只要 Contents 读写 + Issues 读写，仅限本仓库。</p>"+
    "<div class='form-row'><label>GitHub 用户名</label><input id='gOwner' value='"+esc(gh.owner||"")+"'></div>"+
    "<div class='form-row'><label>仓库名</label><input id='gRepo' value='"+esc(gh.repo||"")+"'></div>"+
    "<div class='form-row'><label>接收提交的邮箱（推荐，用户不用登录）</label><input id='gMail' value='"+esc(DATA.notifyEmail||"")+"' placeholder='you@example.com'></div>"+
    "<div class='form-row'><label>提交中转地址（可选）</label><input id='gProxy' value='"+esc(gh.submitProxy||"")+"' placeholder='可空'></div>"+
    "<div class='form-row'><label>发布用 Token</label><input id='gTok' type='password' value='"+esc(tok)+"' placeholder='github_pat_...'></div>"+
    "<div class='toolbar'><button class='btn btn-gold' onclick='saveSiteSettings()'>保存设置</button><button class='btn' onclick='closeModal()'>取消</button></div>");
}
function saveSiteSettings(){
  DATA.github={owner:document.getElementById("gOwner").value.trim(),repo:document.getElementById("gRepo").value.trim(),submitProxy:document.getElementById("gProxy").value.trim()};
  DATA.notifyEmail=document.getElementById("gMail").value.trim();
  var tok=document.getElementById("gTok").value.trim();
  if(tok) localStorage.setItem(TOKEN_KEY,tok);
  DATA.updated=today();markDirty();closeModal();toast("设置已保存");
}

function parseIssuePayload(issue){
  var body=issue.body||"";
  var m=body.match(/```json\s*([\s\S]*?)```/);
  if(m){try{return JSON.parse(m[1])}catch(e){}}
  return {name:(issue.title||"").replace(/^【群索引提交】/,"").trim(),ids:"",tags:"",extra:body,section:""};
}
async function refreshRemoteQueue(){
  var gh=DATA.github||{};
  if(!gh.owner||!gh.repo)return;
  try{
    var res=await fetch("https://api.github.com/repos/"+gh.owner+"/"+gh.repo+"/issues?state=open&labels=group-submit&per_page=50",{headers:{"Accept":"application/vnd.github+json","User-Agent":"ygo-index"}});
    if(!res.ok)return;
    var issues=await res.json();
    DATA.pending=(issues||[]).filter(function(it){return !it.pull_request}).map(function(it){
      var p=parseIssuePayload(it);
      return {issue:it.number,url:it.html_url,name:p.name,ids:p.ids,tags:p.tags,extra:p.extra,section:p.section||"",title:it.title};
    });
    render();
  }catch(e){}
}
function openQueue(){
  refreshRemoteQueue().then(function(){
    var list=DATA.pending||[];
    if(!list.length){openModal("<h3>审核队列</h3><p class='note'>当前没有待审提交。配置提交中转后，用户点「提交新群」会进这里。</p><button class='btn' onclick='closeModal()'>关闭</button>");return}
    var html="<h3>审核队列（"+list.length+"）</h3>";
    list.forEach(function(p,i){
      html+="<div class='card'><b>"+esc(p.name||p.title)+"</b><div class='note'>群号："+esc(p.ids||"（见原文）")+"<br>标签："+esc(p.tags||"-")+"<br>备注："+esc(p.extra||"-")+(p.url?"<br><a href='"+esc(p.url)+"' target='_blank'>GitHub Issue #"+p.issue+"</a>":"")+"</div>"+
        "<div class='toolbar'><button class='btn btn-ok' onclick='approvePending("+i+")'>通过并编辑</button><button class='btn btn-danger' onclick='rejectPending("+i+")'>拒绝</button></div></div>";
    });
    html+="<button class='btn' onclick='closeModal()'>关闭</button>";
    openModal(html);
  });
}
function approvePending(i){
  var p=DATA.pending[i];if(!p)return;
  closeModal();
  var tmp={id:"g"+Date.now(),name:p.name||"",tags:(p.tags||"").split(/[，,]/).map(function(x){return x.trim()}).filter(Boolean),section:p.section||"其他",ids:parseIdLines(p.ids||""),extra:typeof p.extra==="string"?p.extra:"",missing:false,pinned:false};
  DATA._approvingIssue=p.issue;
  var idLines=(tmp.ids||[]).map(function(x){return x.num+(x.note?"（"+x.note+"）":"")}).join("\n");
  if(!idLines&&p.ids) idLines=String(p.ids);
  openModal("<h3>通过前确认</h3>"+
    "<div class='form-row'><label>群名</label><input id='eName' value='"+esc(tmp.name)+"'></div>"+
    "<div class='form-row'><label>标签</label><input id='eTags' value='"+esc((tmp.tags||[]).join("，"))+"'></div>"+
    "<div class='form-row'><label>分区</label><select id='eSec'>"+SECTIONS.map(function(L){return "<option value='"+L+"'"+(tmp.section===L?" selected":"")+">"+L+"</option>"}).join("")+"</select></div>"+
    "<div class='form-row'><label>群号</label><textarea id='eIds' rows='4'>"+esc(idLines)+"</textarea></div>"+
    "<div class='form-row'><label>备注</label><input id='eExtra' value='"+esc(tmp.extra||"")+"'></div>"+
    "<div class='form-row'><label><input type='checkbox' id='ePinned'> 置顶</label> <label><input type='checkbox' id='eMissing'> 暂缺</label></div>"+
    "<div class='toolbar'><button class='btn btn-gold' onclick='confirmApprove()'>写入索引</button><button class='btn' onclick='closeModal()'>取消</button></div>");
}
function confirmApprove(){
  var name=document.getElementById("eName").value.trim();if(!name){toast("请填群名");return}
  var tags=document.getElementById("eTags").value.split(/[，,]/).map(function(x){return x.trim()}).filter(Boolean);
  DATA.groups.push({id:"g"+Date.now(),name:name,aliases:tags.slice(),tags:tags,section:document.getElementById("eSec").value,ids:parseIdLines(document.getElementById("eIds").value),extra:document.getElementById("eExtra").value.trim(),missing:document.getElementById("eMissing").checked,pinned:document.getElementById("ePinned").checked,addedAt:Date.now()});
  var issue=DATA._approvingIssue;DATA._approvingIssue=null;
  DATA.pending=(DATA.pending||[]).filter(function(x){return x.issue!==issue});
  DATA.updated=today();markDirty();closeModal();render();toast("已加入索引，请再点「发布到网站」");
  if(issue) closeIssue(issue,"approved");
}
function rejectPending(i){
  var p=DATA.pending[i];if(!p)return;
  DATA.pending.splice(i,1);render();
  if(p.issue) closeIssue(p.issue,"rejected");
  toast("已拒绝");
  openQueue();
}
async function closeIssue(num,reason){
  var tok=localStorage.getItem(TOKEN_KEY);var gh=DATA.github||{};
  if(!tok||!gh.owner)return;
  try{
    await fetch("https://api.github.com/repos/"+gh.owner+"/"+gh.repo+"/issues/"+num,{
      method:"PATCH",
      headers:{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json","User-Agent":"ygo-index","Content-Type":"application/json"},
      body:JSON.stringify({state:"closed",state_reason:reason==="approved"?"completed":"not_planned"})
    });
  }catch(e){}
}

async function publishToGitHub(){
  var tok=localStorage.getItem(TOKEN_KEY);var gh=DATA.github||{};
  if(!tok){openSiteSettings();toast("请先在发布设置里粘贴 Token");return}
  if(!gh.owner||!gh.repo){toast("缺少仓库信息");return}
  var payload=JSON.parse(JSON.stringify(DATA));
  delete payload.pending;delete payload._approvingIssue;
  var content=unescape(encodeURIComponent(JSON.stringify(payload,null,2)));
  var b64=btoa(content);
  toast("正在发布…");
  try{
    var meta=await fetch("https://api.github.com/repos/"+gh.owner+"/"+gh.repo+"/contents/data.json",{headers:{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json","User-Agent":"ygo-index"}});
    var sha=null;if(meta.ok){var mj=await meta.json();sha=mj.sha}
    var put=await fetch("https://api.github.com/repos/"+gh.owner+"/"+gh.repo+"/contents/data.json",{
      method:"PUT",
      headers:{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json","User-Agent":"ygo-index","Content-Type":"application/json"},
      body:JSON.stringify({message:"update group index "+payload.updated,content:b64,sha:sha})
    });
    var pj=await put.json();
    if(!put.ok){toast("发布失败："+(pj.message||put.status));return}
    DIRTY=false;toast("已发布，稍等刷新即可");
    render();
  }catch(e){toast("发布失败，请检查 Token 与仓库权限")}
}

function formatIdsTxt(g){if(g.missing)return "暂缺";return (g.ids||[]).map(function(x){return (isUnavailable(x)?"~~"+x.num+"~~":x.num)+(x.note?"（"+x.note+"）":"")}).join("、")}
function formatLine(g){return g.name+"："+formatIdsTxt(g)+(g.extra?" "+g.extra:"")}
function buildPlainDocument(){
  var s=DATA,lines=[s.title||"游戏王群索引","",s.subtitle?"（"+String(s.subtitle).replace(/^（|）$/g,"")+"）":"","*最后更新于："+s.updated];
  s.groups.filter(function(g){return g.pinned}).forEach(function(g){lines.push("**"+formatLine(g))});
  lines.push("","说明：","",ensureAboutFeedback(s),"");
  SECTIONS.forEach(function(L){var rows=s.groups.filter(function(g){return g.section===L});if(!rows.length)return;lines.push(L==="其他"?"其他：":L);rows.forEach(function(g){lines.push(formatLine(g))});lines.push("")});
  lines.push("实用连接：");(s.links||[]).forEach(function(L){lines.push((L.label||"")+"："+(L.url||""))});
  return lines.filter(function(x,i,a){return !(x===""&&a[i-1]==="")}).join("\n");
}
function formatIdsHtml(g){if(g.missing)return "暂缺";return (g.ids||[]).map(function(x){var n=esc(x.num);if(isUnavailable(x))n='<span style="text-decoration:line-through">'+n+"</span>";return n+(x.note?"（"+esc(x.note)+"）":"")}).join("、")}
function buildWordHtml(){
  var s=DATA,h=['<html xmlns:o="urn:schemas-microsoft-com:office:office"><head><meta charset="utf-8"><style>body{font-family:Microsoft YaHei,sans-serif;font-size:12pt}h1{font-size:18pt}.sec{font-weight:700;margin-top:12pt}</style></head><body>',
    "<h1>"+esc(s.title)+"</h1>",s.subtitle?"<p>（"+esc(s.subtitle)+"）</p>":"","<p><b>*最后更新于："+esc(s.updated)+"</b></p>"];
  s.groups.filter(function(g){return g.pinned}).forEach(function(g){h.push("<p><b>**"+esc(g.name)+"：</b>"+formatIdsHtml(g)+"</p>")});
  h.push("<h2>说明：</h2>");esc(ensureAboutFeedback(s)).split(/\n/).forEach(function(line){h.push("<p>"+(line||"&nbsp;")+"</p>")});
  SECTIONS.forEach(function(L){var rows=s.groups.filter(function(g){return g.section===L});if(!rows.length)return;h.push("<p class='sec'>"+(L==="其他"?"其他：":L)+"</p>");rows.forEach(function(g){h.push("<p>"+esc(g.name)+"："+formatIdsHtml(g)+(g.extra?" "+esc(g.extra):"")+"</p>")})});
  h.push("<h2>实用连接：</h2>");(s.links||[]).forEach(function(L){h.push("<p>"+esc(L.label)+"：<a href='"+esc(L.url)+"'>"+esc(L.url)+"</a></p>")});
  return h.join("")+"</body></html>";
}
function downloadBlob(content,name,mime){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click()}
function shareText(){copyText(buildPlainDocument())}
function exportTxt(){downloadBlob(buildPlainDocument(),"游戏王群索引.txt","text/plain;charset=utf-8");toast("已导出记事本")}
function exportWord(){downloadBlob("\ufeff"+buildWordHtml(),"游戏王群索引.doc","application/msword");toast("已导出 Word")}
function exportJSON(){downloadBlob(JSON.stringify(DATA,null,2),"ygo-group-index.json","application/json");toast("已导出 JSON")}

loadData().then(render).catch(function(e){
  document.getElementById("aboutCard").innerHTML="<div class='note'>数据文件 data.json 没有加载到。请确认仓库根目录同时有 index.html 和 data.json。</div>";
});
</script>
