<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>游戏王群索引</title>
<style>
:root {
  --bg: #0e1117;
  --bg2: #161b24;
  --card: #1c2330;
  --line: #2a3344;
  --text: #e8edf5;
  --muted: #8b97ab;
  --gold: #d4b15f;
  --gold2: #f0d78c;
  --blue: #6ea8ff;
  --danger: #e57373;
  --dead: #6b7380;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
a { color: var(--blue); }
.wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 80px; }
header.hero {
  background: linear-gradient(160deg, #1a2233 0%, #12161f 60%, #0e1117 100%);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px 20px 16px;
  margin-bottom: 14px;
}
header.hero h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: .04em; color: var(--gold2); }
.sub { color: var(--muted); font-size: 13px; }
.updated { margin-top: 10px; color: var(--gold); font-size: 13px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn {
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 13px;
}
.btn:hover { border-color: var(--gold); color: var(--gold2); }
.btn-gold { background: #3a3018; border-color: #6e5a28; color: var(--gold2); }
.btn-danger { color: var(--danger); border-color: #5a3030; }
.drop { position: relative; display: inline-block; }
.drop-menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
  min-width: 180px; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px;
  padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
.drop.open .drop-menu { display: block; }
.drop-menu button {
  display: block; width: 100%; text-align: left; border: 0; background: transparent;
  color: var(--text); padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
}
.drop-menu button:hover { background: #2a2416; color: var(--gold2); }
.search-card {
  margin: 14px 0 12px;
  padding: 16px;
  border: 2px solid var(--gold);
  border-radius: 16px;
  background: linear-gradient(180deg, #2a2416, #161b24);
  box-shadow: 0 0 0 4px rgba(212,177,95,.08);
}
.search-card label { display: block; color: var(--gold2); font-weight: 700; margin-bottom: 8px; font-size: 15px; }
.search-card input {
  width: 100%; background: #0e1117; border: 1px solid #6e5a28; color: var(--text);
  border-radius: 12px; padding: 14px 16px; font-size: 18px; outline: none;
}
.search-card input:focus { border-color: var(--gold2); box-shadow: 0 0 0 3px rgba(240,215,140,.15); }
.search-card .hintline { margin-top: 8px; color: var(--muted); font-size: 12px; }
.letters {
  position: sticky; top: 0; z-index: 20; background: rgba(14,17,23,.94);
  backdrop-filter: blur(8px); padding: 8px 0; display: flex; flex-wrap: wrap; gap: 4px;
  border-bottom: 1px solid var(--line); margin: 0 -16px 8px; padding-left: 16px; padding-right: 16px;
}
.letters a {
  color: var(--muted); text-decoration: none; min-width: 28px; height: 28px; display: flex;
  align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; padding: 0 4px;
}
.letters a:hover { background: #2a2416; color: var(--gold2); }
.hint { color: var(--muted); font-size: 13px; margin: 8px 0 16px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 10px 0;
}
.card h2 { margin: 0 0 8px; font-size: 16px; color: var(--gold2); }
.note { color: var(--muted); font-size: 13px; white-space: pre-wrap; }
.featured { border-color: #6e5a28; background: linear-gradient(180deg, #2a2416, #1c2330); }
.row {
  display: grid; grid-template-columns: minmax(160px, 1.1fr) minmax(180px, 1.5fr);
  gap: 8px 16px; padding: 10px 4px; border-bottom: 1px solid #232b38; align-items: start;
}
body.admin .row { grid-template-columns: minmax(140px, 1fr) minmax(160px, 1.2fr) minmax(90px, .7fr) auto; }
@media (max-width: 720px) {
  .row, body.admin .row { grid-template-columns: 1fr; }
}
.row:last-child { border-bottom: none; }
.name { font-weight: 650; }
.name.struck { text-decoration: line-through; color: var(--dead); }
.ids { display: flex; flex-wrap: wrap; gap: 6px; }
.idchip {
  display: inline-flex; align-items: center; gap: 6px; background: var(--bg2);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-family: ui-monospace, Consolas, monospace; font-size: 13px;
}
.idchip.dead { color: var(--dead); text-decoration: line-through; opacity: .75; }
.idchip button {
  border: 0; background: transparent; color: var(--gold); cursor: pointer; font-size: 12px; padding: 0 2px;
}
.tagnote { color: var(--muted); font-size: 12px; }
.tags-cell { display: none; color: var(--muted); font-size: 12px; word-break: break-all; }
body.admin .tags-cell { display: block; }
.sec-h { margin: 22px 0 8px; padding-top: 8px; font-size: 22px; color: var(--gold); border-top: 1px solid var(--line); }
.empty { color: var(--muted); padding: 24px 8px; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: #223; color: #fff; padding: 8px 14px; border-radius: 999px;
  display: none; z-index: 50; border: 1px solid var(--gold);
}
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 40;
  align-items: center; justify-content: center; padding: 16px;
}
.modal {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; padding: 18px;
  width: min(560px, 100%); max-height: 90vh; overflow: auto;
}
.modal h3 { margin: 0 0 12px; color: var(--gold2); }
.form-row { margin: 8px 0; }
.form-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.form-row input, .form-row textarea, .form-row select {
  width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 8px 10px; font: inherit;
}
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
.admin-only { display: none; }
body.admin .admin-only { display: inline-flex; }
body.admin .admin-block { display: block; }
.admin-block { display: none; }
.pinbox { display: none; align-items: center; gap: 4px; font-size: 12px; color: var(--gold2); white-space: nowrap; }
body.admin .pinbox { display: inline-flex; }
.count { color: var(--muted); font-size: 12px; }
footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
footer ul { padding-left: 18px; }
.hide-dead .idchip.dead, .hide-dead .row.all-dead { display: none; }
.about-feedback { margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1 id="pageTitle">游戏王群索引</h1>
    <div class="sub" id="pageSub"></div>
    <div class="updated" id="lastUpdate"></div>
    <div class="toolbar">
      <div class="drop" id="exportDrop">
        <button class="btn" onclick="toggleExportMenu(event)">导出 ▾</button>
        <div class="drop-menu">
          <button type="button" onclick="exportWord()">导出到 Word</button>
          <button type="button" onclick="exportTxt()">导出到记事本</button>
          <button type="button" onclick="exportJSON()">导出 JSON 备份</button>
        </div>
      </div>
      <button class="btn btn-gold" onclick="openSubmit()">提交新群</button>
      <button class="btn" onclick="shareText()">复制为文本</button>
      <button class="btn" onclick="toggleDead()">隐藏/显示已失效群号</button>
      <button class="btn" id="adminBtn" onclick="openAdmin()">管理员</button>
      <button class="btn btn-gold admin-only" onclick="openEditor(null)">新增条目</button>
      <button class="btn admin-only" onclick="openMetaEditor()">编辑说明/页头</button>
      <button class="btn admin-only" onclick="logoutAdmin()">退出管理</button>
    </div>
  </header>

  <div class="card" id="aboutCard"></div>

  <div class="search-card">
    <label for="q">搜索卡组 / 别名 / 群号 / 标签</label>
    <input id="q" type="search" placeholder="例如：废二、古生物、刺猬、闪刀姬、746902919" oninput="render()" autofocus>
    <div class="hintline">不区分大小写。管理员填写的隐藏标签也会被搜到，普通浏览不会看到标签列。</div>
  </div>

  <div class="card featured" id="featuredCard"></div>

  <div class="letters" id="letters"></div>
  <div class="hint"><span class="count" id="count"></span> · 有效群号可点「复制」；已失效群号只显示删除线，不提供复制</div>
  <div id="list"></div>

  <footer>
    <h2 style="color:var(--gold2);font-size:16px;">实用连接</h2>
    <ul id="linkList"></ul>
    <p id="footerNote"></p>
  </footer>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

function hashPw(s) {
  var h = 2166136261;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16);
}
function loadOverlay() {
  try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { return null; }
}
function saveOverlay(o) {
  try { localStorage.setItem(STORE, JSON.stringify(o)); } catch (e) {}
}
function normalizeState(raw) {
  var s = JSON.parse(JSON.stringify(raw));
  if (!s.groups) s.groups = [];
  if (!s.title) s.title = BUILTIN.title;
  if (s.subtitle == null) s.subtitle = BUILTIN.subtitle;
  if (s.about == null) s.about = BUILTIN.about;
  if (!s.feedbackQq) s.feedbackQq = BUILTIN.feedbackQq;
  if (!s.feedbackAnswer) s.feedbackAnswer = BUILTIN.feedbackAnswer;
  if (s.footerNote == null) s.footerNote = BUILTIN.footerNote;
  if (!s.links) s.links = JSON.parse(JSON.stringify(BUILTIN.links));
  s.groups.forEach(function (g) {
    if (!g.tags) g.tags = (g.aliases || []).slice();
    if (g.pinned == null) g.pinned = !!g.featured;
  });
  return s;
}
function getState() {
  var o = loadOverlay();
  return normalizeState(o || BUILTIN);
}
function setState(s) { saveOverlay(s); }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(function () { t.style.display = "none"; }, 1600);
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast("已复制 " + text); }, function () { fallbackCopy(text); });
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  var a = document.createElement("textarea");
  a.value = text; document.body.appendChild(a); a.select();
  try { document.execCommand("copy"); toast("已复制 " + text); } catch (e) { toast("复制失败，请手动选择"); }
  document.body.removeChild(a);
}

function isUnavailable(id) {
  if (!id) return true;
  if (id.dead) return true;
  var n = id.note || "";
  return /炸了|已解散|无法申请|已无活人|似了|死了|没了|搜不到/.test(n);
}
function liveIds(g) {
  return (g.ids || []).filter(function (x) { return !isUnavailable(x); });
}
function searchBlob(g) {
  var parts = [g.name, (g.aliases || []).join(" "), (g.tags || []).join(" "), g.extra || "", g.section || ""];
  (g.ids || []).forEach(function (x) { parts.push(x.num, x.note || ""); });
  return parts.join(" ").toLowerCase();
}
function matches(g, q) {
  if (!q) return true;
  return searchBlob(g).indexOf(q) !== -1;
}

function renderId(id) {
  var dead = isUnavailable(id);
  var cls = "idchip" + (dead ? " dead" : "");
  var note = id.note ? '<span class="tagnote">（' + esc(id.note) + "）</span>" : "";
  var copyBtn = dead ? "" : '<button type="button" title="复制" onclick="copyText(\'' + esc(id.num) + "')\">复制</button>";
  return '<span class="' + cls + '"><span>' + esc(id.num) + "</span>" + note + copyBtn + "</span>";
}

function renderRow(g) {
  var allDead = g.ids && g.ids.length && liveIds(g).length === 0 && !g.missing;
  var extra = g.extra ? '<div class="tagnote">' + esc(g.extra) + "</div>" : "";
  var idsHtml;
  if (g.missing) idsHtml = '<span class="tagnote">暂缺</span>';
  else if (!g.ids || !g.ids.length) idsHtml = '<span class="tagnote">无群号</span>';
  else idsHtml = '<div class="ids">' + g.ids.map(renderId).join("") + "</div>";
  var tagsHtml = '<div class="tags-cell">' + (g.tags && g.tags.length ? esc(g.tags.join("，")) : '<span class="tagnote">无标签</span>') + "</div>";
  var pin = '<label class="pinbox"><input type="checkbox"' + (g.pinned ? " checked" : "") + ' onchange="togglePin(\'' + g.id + '\', this.checked)">置顶</label>';
  var admin = "";
  if (isAdmin) {
    admin = '<div class="actions">' + pin +
      '<button class="btn" onclick="openEditor(\'' + g.id + "')\">修改</button>" +
      '<button class="btn btn-danger" onclick="deleteGroup(\'' + g.id + "')\">删除</button></div>";
  }
  return '<div class="row' + (allDead ? " all-dead" : "") + '" data-id="' + esc(g.id) + '">' +
    '<div><div class="name' + (g.nameStruck ? " struck" : "") + '">' + esc(g.name) + "</div>" + extra + "</div>" +
    "<div>" + idsHtml + "</div>" + tagsHtml + admin + "</div>";
}

    featBox.innerHTML = "<h2>置顶</h2>" + pinned.map(renderRow).join("");
  }

  document.getElementById("letters").innerHTML = SECTIONS.map(function (L) {
    return '<a href="#sec-' + L + '">' + L + "</a>";
  }).join("");

  var shown = 0;
  var html = "";
  SECTIONS.forEach(function (L) {
    var rows = groups.filter(function (g) { return g.section === L && matches(g, q); });
    if (!rows.length) return;
    html += '<div class="sec-h" id="sec-' + L + '">' + L + "</div>";
    rows.forEach(function (g) { html += renderRow(g); shown++; });
  });
  document.getElementById("list").innerHTML = html || '<div class="empty">没有匹配「' + esc(q) + "」的条目。试试别名、标签或群号。</div>";
  document.getElementById("count").textContent = q ? ("找到 " + shown + " 条") : ("共 " + groups.length + " 条卡组群");
  document.body.classList.toggle("admin", isAdmin);
  document.body.classList.toggle("hide-dead", hideDead);
  document.getElementById("adminBtn").textContent = isAdmin ? "管理中" : "管理员";
}

function toggleDead() { hideDead = !hideDead; render(); }

function openModal(inner) {
  document.getElementById("modal").innerHTML = inner;
  document.getElementById("modalBg").style.display = "flex";
}
function closeModal() { document.getElementById("modalBg").style.display = "none"; }

function openAdmin() {
  if (isAdmin) { toast("已在管理模式"); return; }
  var stored = null;
  try { stored = localStorage.getItem(ADMIN_KEY); } catch (e) {}
  openModal(
    "<h3>管理员</h3>" +
    '<p class="note">' + (stored ? "请输入你之前设定的密码。" : "第一次使用：输入一个密码。密码只存在这台设备的浏览器里。") + "</p>" +
    '<div class="form-row"><label>密码</label><input id="pw" type="password"></div>' +
    '<div class="toolbar"><button class="btn btn-gold" onclick="doLogin()">确定</button><button class="btn" onclick="closeModal()">取消</button></div>'
  );
  setTimeout(function () { var el = document.getElementById("pw"); if (el) el.focus(); }, 50);
}
function doLogin() {
  var pw = document.getElementById("pw").value || "";
  if (!pw) { toast("请输入密码"); return; }
  var h = hashPw(pw);
  var stored = null;
  try { stored = localStorage.getItem(ADMIN_KEY); } catch (e) {}
  if (!stored) {
    try { localStorage.setItem(ADMIN_KEY, h); } catch (e) {}
    isAdmin = true; closeModal(); render(); toast("已设定管理员密码");
    return;
  }
  if (stored === h) { isAdmin = true; closeModal(); render(); toast("已进入管理"); }
  else toast("密码不对");
}
function logoutAdmin() { isAdmin = false; render(); }

function findGroup(id) {
  var s = getState();
  for (var i = 0; i < s.groups.length; i++) {
    if (s.groups[i].id === id) return { s: s, g: s.groups[i], idx: i };
  }
  return null;
}

function togglePin(id, on) {
  var f = findGroup(id);
  if (!f) return;
  f.g.pinned = !!on;
  f.s.updated = today();
  setState(f.s);
  render();
}

function openSubmit() {
  var s = getState();
  openModal(
    "<h3>提交新群</h3>" +
    '<p class="note">任何人都可以填。提交后请把生成的文本发到反馈群 <b>' + esc(s.feedbackQq || "746902919") +
    "</b>，进群答案：<b>" + esc(s.feedbackAnswer || "形而上学枫叶") +
    "</b>。管理员审核通过后才会写进索引。</p>" +
    '<div class="form-row"><label>群名 *</label><input id="sName" placeholder="例如：废品二重身"></div>' +
    '<div class="form-row"><label>别名 / 大家口头叫法（选填，逗号分隔）</label><input id="sTags" placeholder="例如：废二"></div>' +
    '<div class="form-row"><label>群号 *（多个用顿号或换行）</label><textarea id="sIds" rows="3" placeholder="427968149"></textarea></div>' +
    '<div class="form-row"><label>备注（选填）</label><input id="sExtra" placeholder="例如：新群 / 备用群"></div>' +
    '<div class="toolbar">' +
      '<button class="btn btn-gold" onclick="prepareSubmit()">生成并复制提交文本</button>' +
      '<button class="btn" onclick="closeModal()">取消</button>' +
    "</div>" +
    '<p class="note" id="sResult" style="margin-top:10px;display:none;white-space:pre-wrap"></p>'
  );
}
function prepareSubmit() {
  var s = getState();
  var name = (document.getElementById("sName").value || "").trim();
  var ids = (document.getElementById("sIds").value || "").trim();
  var tags = (document.getElementById("sTags").value || "").trim();
  var extra = (document.getElementById("sExtra").value || "").trim();
  if (!name || !ids) { toast("请至少填写群名和群号"); return; }
  var msg = [
    "【游戏王群索引-新群提交】",
    "群名：" + name,
    "群号：" + ids.replace(/\n+/g, "、"),
    tags ? ("别名：" + tags) : "",
    extra ? ("备注：" + extra) : "",
    "请管理员审核后加入索引。"
  ].filter(Boolean).join("\n");
  var box = document.getElementById("sResult");
  box.style.display = "block";
  box.textContent = "已复制下面这段，请发到反馈群 " + (s.feedbackQq || "") + "：\n\n" + msg;
  copyText(msg);
}

function openEditor(id) {
  var g = {
    id: "g" + Date.now(),
    name: "", aliases: [], tags: [], section: "其他",
    ids: [{ num: "", note: "", dead: false }],
    extra: "", missing: false, nameStruck: false, pinned: false
  };
  if (id) {
    var f = findGroup(id);
    if (!f) return;
    g = JSON.parse(JSON.stringify(f.g));
  }
  var idLines = (g.ids && g.ids.length ? g.ids : [{ num: "", note: "", dead: false }]).map(function (x) {
    return (x.num || "") + (x.note ? "（" + x.note + "）" : "") + (isUnavailable(x) ? " [失效]" : "");
  }).join("\n");
  var secOpts = SECTIONS.map(function (L) {
    return '<option value="' + L + '"' + (g.section === L ? " selected" : "") + ">" + L + "</option>";
  }).join("");
  openModal(
    "<h3>" + (id ? "修改条目" : "新增条目") + "</h3>" +
    '<div class="form-row"><label>群名</label><input id="eName" value="' + esc(g.name) + '"></div>' +
    '<div class="form-row"><label>隐藏标签（逗号分隔，普通用户看不到，搜索能匹配）</label><input id="eTags" value="' + esc((g.tags || []).join("，")) + '"></div>' +
    '<div class="form-row"><label>分区</label><select id="eSec">' + secOpts + "</select></div>" +
    '<div class="form-row"><label>群号（一行一个）。格式：123456789 或 123456789（新群） 或 123456789 [失效]</label><textarea id="eIds" rows="5">' + esc(idLines) + "</textarea></div>" +
    '<div class="form-row"><label>备注</label><input id="eExtra" value="' + esc(g.extra || "") + '"></div>' +
    '<div class="form-row"><label><input type="checkbox" id="eMissing"' + (g.missing ? " checked" : "") + "> 暂缺群号</label></div>" +
    '<div class="form-row"><label><input type="checkbox" id="ePinned"' + (g.pinned ? " checked" : "") + "> 置顶</label></div>" +
    '<div class="toolbar"><button class="btn btn-gold" onclick="saveEditor(\'' + esc(g.id) + "', " + (id ? "true" : "false") + ')">保存</button><button class="btn" onclick="closeModal()">取消</button></div>'
  );
}

function parseIdLines(text) {
  var out = [];
  String(text || "").split(/\n+/).forEach(function (line) {
    line = line.trim();
    if (!line) return;
    var dead = /\[失效\]|\[死\]|\[炸\]/.test(line);
    line = line.replace(/\s*\[(失效|死|炸)\]\s*/g, "");
    var m = line.match(/^(\d{5,12})\s*(?:（([^）]*)）|\(([^)]*)\))?/);
    if (m) {
      var note = (m[2] || m[3] || "").trim();
      out.push({ num: m[1], note: note, dead: dead || /炸了|已解散|无法申请|已无活人/.test(note) });
    }
  });
  return out;
}

function today() {
  var d = new Date();
  var dd = ("0" + d.getDate()).slice(-2);
  var mm = ("0" + (d.getMonth() + 1)).slice(-2);
  return dd + "/" + mm + "/" + d.getFullYear();
}

function saveEditor(id, exists) {
  var name = document.getElementById("eName").value.trim();
  if (!name) { toast("请填写群名"); return; }
  var tags = document.getElementById("eTags").value.split(/[，,]/).map(function (x) { return x.trim(); }).filter(Boolean);
  var g = {
    id: id,
    name: name,
    aliases: tags.slice(),
    tags: tags,
    section: document.getElementById("eSec").value,
    ids: parseIdLines(document.getElementById("eIds").value),
    extra: document.getElementById("eExtra").value.trim(),
    missing: document.getElementById("eMissing").checked,
    pinned: document.getElementById("ePinned").checked,
    nameStruck: false,
    addedAt: Date.now()
  };
  var s = getState();
  if (exists) {
    var found = false;
    for (var i = 0; i < s.groups.length; i++) {
      if (s.groups[i].id === id) { s.groups[i] = g; found = true; break; }
    }
    if (!found) s.groups.push(g);
  } else s.groups.push(g);
  s.updated = today();
  setState(s);
  closeModal();
  render();
  toast("已保存（仅这台设备）");
}

function deleteGroup(id) {
  var s = getState();
  s.groups = s.groups.filter(function (g) { return g.id !== id; });
  s.updated = today();
  setState(s);
  render();
  toast("已删除（仅这台设备）");
}

function openMetaEditor() {
  var s = getState();
  var linkText = (s.links || []).map(function (L) { return L.label + " | " + L.url; }).join("\n");
  openModal(
    "<h3>编辑页头 / 说明 / 连接</h3>" +
    '<div class="form-row"><label>标题</label><input id="mTitle" value="' + esc(s.title) + '"></div>' +
    '<div class="form-row"><label>标题下的一句说明</label><textarea id="mSub" rows="3">' + esc(s.subtitle) + "</textarea></div>" +
    '<div class="form-row"><label>说明正文</label><textarea id="mAbout" rows="8">' + esc(s.about) + "</textarea></div>" +
    '<div class="form-row"><label>反馈群号</label><input id="mQq" value="' + esc(s.feedbackQq) + '"></div>' +
    '<div class="form-row"><label>进群答案</label><input id="mAns" value="' + esc(s.feedbackAnswer) + '"></div>' +
    '<div class="form-row"><label>页脚备注</label><textarea id="mFoot" rows="3">' + esc(s.footerNote) + "</textarea></div>" +
    '<div class="form-row"><label>实用连接（一行一个：名称 | 网址）</label><textarea id="mLinks" rows="6">' + esc(linkText) + "</textarea></div>" +
    '<div class="toolbar"><button class="btn btn-gold" onclick="saveMeta()">保存</button><button class="btn" onclick="closeModal()">取消</button></div>'
  );
}
function saveMeta() {
  var s = getState();
  s.title = document.getElementById("mTitle").value.trim() || s.title;
  s.subtitle = document.getElementById("mSub").value;
  s.about = document.getElementById("mAbout").value;
  s.feedbackQq = document.getElementById("mQq").value.trim();
  s.feedbackAnswer = document.getElementById("mAns").value.trim();
  s.footerNote = document.getElementById("mFoot").value;
  s.links = document.getElementById("mLinks").value.split(/\n+/).map(function (line) {
    line = line.trim();
    if (!line) return null;
    var parts = line.split("|");
    if (parts.length < 2) return null;
    return { label: parts[0].trim(), url: parts.slice(1).join("|").trim() };
  }).filter(Boolean);
  s.updated = today();
  setState(s);
  closeModal();
  render();
  toast("说明已更新（仅这台设备）");
}

function ensureAboutFeedback(s) {
  var about = s.about || "";
  var qq = s.feedbackQq || "";
  var ans = s.feedbackAnswer || "";
  if (qq && about.indexOf(qq) === -1) {
    about = about.replace(/\s+$/, "");
    about += "\n\n如果遇到群号搜不到等情况，多半是群炸了，或者你有新的群号想加入此索引，请加入：" + qq + " 反馈给我，谢谢大家。";
    if (ans) about += "群问题答案：" + ans + "。";
  }
  return about;
}

function formatIdsTxt(g) {
  if (g.missing) return "暂缺";
  return (g.ids || []).map(function (x) {
    var core = isUnavailable(x) ? "~~" + x.num + "~~" : x.num;
    return core + (x.note ? "（" + x.note + "）" : "");
  }).join("、");
}
function formatLine(g) {
  return g.name + "：" + formatIdsTxt(g) + (g.extra ? " " + g.extra : "");
}

function buildPlainDocument(s) {
  var lines = [];
  lines.push(s.title || "游戏王群索引");
  lines.push("");
  if (s.subtitle) {
    lines.push("（" + String(s.subtitle).replace(/^（|）$/g, "") + "）");
    lines.push("");
  }
  lines.push("*最后更新于：" + (s.updated || ""));
  var pinned = (s.groups || []).filter(function (g) { return g.pinned; });
  pinned.forEach(function (g) {
    lines.push("**" + formatLine(g));
  });
  lines.push("");
  lines.push("说明：");
  lines.push("");
  lines.push(ensureAboutFeedback(s));
  lines.push("");
  SECTIONS.forEach(function (L) {
    var rows = s.groups.filter(function (g) { return g.section === L; });
    if (!rows.length) return;
    lines.push(L === "其他" ? "其他：" : L);
    rows.forEach(function (g) { lines.push(formatLine(g)); });
    lines.push("");
  });
  lines.push("实用连接：");
  (s.links || []).forEach(function (L) {
    lines.push((L.label || "") + "：" + (L.url || ""));
  });
  return lines.join("\n");
}

function formatIdsHtml(g) {
  if (g.missing) return "暂缺";
  return (g.ids || []).map(function (x) {
    var num = esc(x.num);
    if (isUnavailable(x)) num = '<span style="text-decoration:line-through">' + num + "</span>";
    return num + (x.note ? "（" + esc(x.note) + "）" : "");
  }).join("、");
}

function buildWordHtml(s) {
  var h = [];
  h.push('<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">');
  h.push("<head><meta charset='utf-8'><title>" + esc(s.title || "游戏王群索引") + "</title>");
  h.push("<style>body{font-family:'Microsoft YaHei','PingFang SC',SimSun,sans-serif;font-size:12pt;line-height:1.6}");
  h.push("h1{font-size:18pt;margin:0 0 8pt} h2{font-size:14pt;margin:14pt 0 6pt}");
  h.push(".muted{color:#555} .sec{font-size:14pt;font-weight:700;margin:12pt 0 4pt}");
  h.push("p{margin:0 0 4pt}</style></head><body>");
  h.push("<h1>" + esc(s.title || "游戏王群索引") + "</h1>");
  if (s.subtitle) h.push("<p class='muted'>（" + esc(String(s.subtitle).replace(/^（|）$/g, "")) + "）</p>");
  h.push("<p><b>*最后更新于：" + esc(s.updated || "") + "</b></p>");
  (s.groups || []).filter(function (g) { return g.pinned; }).forEach(function (g) {
    h.push("<p><b>**" + esc(g.name) + "：</b>" + formatIdsHtml(g) + (g.extra ? " " + esc(g.extra) : "") + "</p>");
  });
  h.push("<h2>说明：</h2>");
  esc(ensureAboutFeedback(s)).split(/\n/).forEach(function (line) {
    h.push("<p>" + (line ? line : "&nbsp;") + "</p>");
  });
  SECTIONS.forEach(function (L) {
    var rows = s.groups.filter(function (g) { return g.section === L; });
    if (!rows.length) return;
    h.push("<p class='sec'>" + (L === "其他" ? "其他：" : L) + "</p>");
    rows.forEach(function (g) {
      var name = g.nameStruck ? '<span style="text-decoration:line-through">' + esc(g.name) + "</span>" : esc(g.name);
      h.push("<p>" + name + "：" + formatIdsHtml(g) + (g.extra ? " " + esc(g.extra) : "") + "</p>");
    });
  });
  h.push("<h2>实用连接：</h2>");
  (s.links || []).forEach(function (L) {
    h.push("<p>" + esc(L.label || "") + "：<a href='" + esc(L.url || "") + "'>" + esc(L.url || "") + "</a></p>");
  });
  h.push("</body></html>");
  return h.join("");
}

function downloadBlob(content, filename, mime) {
  var blob = new Blob([content], { type: mime });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}

function toggleExportMenu(ev) {
  if (ev) ev.stopPropagation();
  var box = document.getElementById("exportDrop");
  box.classList.toggle("open");
}
document.addEventListener("click", function () {
  var box = document.getElementById("exportDrop");
  if (box) box.classList.remove("open");
});

function shareText() {
  copyText(buildPlainDocument(getState()));
}
function exportTxt() {
  var s = getState();
  downloadBlob(buildPlainDocument(s), "游戏王群索引.txt", "text/plain;charset=utf-8");
  var box = document.getElementById("exportDrop");
  if (box) box.classList.remove("open");
  toast("已导出记事本文件");
}
function exportWord() {
  var s = getState();
  downloadBlob("\ufeff" + buildWordHtml(s), "游戏王群索引.doc", "application/msword");
  var box = document.getElementById("exportDrop");
  if (box) box.classList.remove("open");
  toast("已导出 Word 文件，用 Word / WPS 打开即可");
}
function exportJSON() {
  var s = getState();
  downloadBlob(JSON.stringify(s, null, 2), "ygo-group-index.json", "application/json");
  var box = document.getElementById("exportDrop");
  if (box) box.classList.remove("open");
  toast("已下载 JSON");
}

render();
</script>
</body>
